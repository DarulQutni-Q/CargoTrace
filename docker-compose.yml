services:
  mysql:
    image: mysql:8.4
    container_name: cargotrace-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cargotrace
      MYSQL_USER: cargotrace
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - cargotrace-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cargotrace-mysql-data:
